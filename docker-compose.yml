services:
  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: resell-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=resell
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - resell-network

  # Redis for BullMQ
  redis:
    image: redis:7-alpine
    container_name: resell-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - resell-network

  # ML Service (Python Flask)
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: resell-ml-service
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - TF_CPP_MIN_LOG_LEVEL=2
      - TF_FORCE_GPU_ALLOW_GROWTH=true
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - resell-network

  # Backend API (Node.js)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Shared by the worker services below — Compose builds this image once
    # and all three services (API + workers) reuse it. No extra Dockerfiles.
    image: resell-backend:latest
    container_name: resell-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/resell
      - REDIS_URL=redis://redis:6379
      - ML_SERVICE_URL=http://ml-service:5000
      - CLIENT_URL=http://localhost:5173
      # Cloudinary (set in .env or environment)
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      # Stripe
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
      # Auth
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRE=7d
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - resell-network

  # AI / image-analysis worker — processes the "image-processing" BullMQ queue
  # (perceptual hashing, CV condition/damage/classification, CNN feature
  # extraction via the ML service, price recommendation + fraud re-score).
  # Entry point matches the existing `npm run worker` package script
  # (node src/workers/imageProcessor.js); node is invoked directly so
  # SIGTERM reaches the worker's graceful-shutdown handler.
  worker-image:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: resell-backend:latest
    container_name: resell-worker-image
    command: ["node", "src/workers/imageProcessor.js"]
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/resell
      - REDIS_URL=redis://redis:6379
      - ML_SERVICE_URL=http://ml-service:5000
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    restart: unless-stopped
    # Workers expose no HTTP port — disable the API image's inherited healthcheck
    healthcheck:
      disable: true
    networks:
      - resell-network

  # Price / duplicate-processing worker — processes the "price-analysis"
  # BullMQ queue (single-product price refinement + the periodic
  # price-refinement-sweep enqueued by the API).
  # Entry point matches the existing `npm run worker:price` package script
  # (node src/workers/priceAnalyzer.js).
  worker-price:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: resell-backend:latest
    container_name: resell-worker-price
    command: ["node", "src/workers/priceAnalyzer.js"]
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/resell
      - REDIS_URL=redis://redis:6379
      - ML_SERVICE_URL=http://ml-service:5000
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: true
    networks:
      - resell-network

  # Frontend (optional - for production)
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: resell-frontend
  #   ports:
  #     - "5173:80"
  #   depends_on:
  #     - backend
  #   networks:
  #     - resell-network

volumes:
  mongo-data:
    driver: local
  redis-data:
    driver: local

networks:
  resell-network:
    driver: bridge